# Memory Benchmark (Apple Silicon / MPS, context_length: 512, n_layer: 6, n_embd: 256, n_head: 4):
# Byte encoding creates 344 tokens for direct grid->solution sequences, requiring context_length >= 512.
# Effective batch size = batch_size (4) * gradient_accumulation_steps (8) = 32

seed: 42
device: auto
dtype: float32
mixed_precision: false
runs_dir: runs
verbose: false

compile: "reduce-overhead" # options: "default" | "reduce-overhead" | "max-autotune" | False

model:
  name: bdh
  params:
    vocab_size: auto
    context_length: 512
    n_layer: 6
    n_embd: 256
    n_head: 4
    dropout: 0.1
    learning_rate: 0.0003
    weight_decay: 0.1
    mlp_internal_dim_multiplier: 32  # memory-efficient setting for 16GB Mac

data:
  name: sudoku_cot
  params:
    num_samples: 10000
    validation_fraction: 0.1
    clues: 30
    batch_size: 4
    context_length: 512
    reasoning_mode: none  # Direct input-to-solution mapping without CoT steps
    tokenizer: byte
    num_workers: 0
    shuffle: true

trainer:
  name: torch
  dtype: float32
  max_epochs: 10
  log_every_n_steps: 100
  validate_every_n_epochs: 1
  gradient_clip_norm: 1.0
  gradient_accumulation_steps: 8

validator:
  name: sudoku
  params:
    num_eval_samples: 32

callbacks:
  - name: checkpoint
    params:
      save_best: true
      monitor: val/sudoku_board_accuracy

loggers:
  - name: terminal
  - name: text_file
  - name: tensorboard
