seed: 42
device: auto
dtype: float32
mixed_precision: true
runs_dir: runs
verbose: false

model:
  name: gpt_model
  params:
    vocab_size: auto
    context_length: 256
    d_model: 256
    n_heads: 8
    n_layers: 6
    dropout: 0.1
    learning_rate: 0.0003
    weight_decay: 0.1

data:
  name: sudoku_cot
  params:
    num_samples: 10000
    validation_fraction: 0.1
    clues: [20, 45]       # Random difficulty: 20 (hard) to 45 (easy) clues per puzzle
    val_clues: 30         # Fixed evaluation difficulty (30 clues)
    batch_size: 32
    context_length: 256
    reasoning_mode: none  # Direct input-to-solution mapping without CoT steps
    tokenizer: gpt2
    num_workers: 0
    shuffle: true

trainer:
  name: torch
  max_epochs: 10
  log_every_n_steps: 100
  validate_every_n_epochs: 1
  gradient_clip_norm: 1.0
  gradient_accumulation_steps: 1

callbacks:
  - name: checkpoint
    params:
      save_best: true

loggers:
  - name: terminal
  - name: text_file
  - name: tensorboard
