seed: 42
device: auto
dtype: float32
mixed_precision: true
runs_dir: runs

model:
  name: bdh
  params:
    vocab_size: auto
    context_length: 1024
    n_layer: 6
    n_embd: 256
    n_head: 4
    dropout: 0.1
    learning_rate: 0.0003
    weight_decay: 0.1

data:
  name: sudoku_cot
  params:
    num_samples: 10000
    validation_fraction: 0.1
    clues: [20, 45]       # Random difficulty: 20 (hard) to 45 (easy) clues per puzzle
    val_clues: 30         # Fixed evaluation difficulty (30 clues)
    batch_size: 16
    context_length: 1024
    reasoning_mode: full  # Supported: full (CoT + solution), none (direct solution), context_only (masked CoT context)
    tokenizer: gpt2
    num_workers: 0
    shuffle: true

trainer:
  name: torch
  max_epochs: 10
  log_every_n_steps: 10
  validate_every_n_epochs: 1
  gradient_clip_norm: 1.0
  gradient_accumulation_steps: 1

callbacks:
  - name: checkpoint
    params:
      save_best: true

loggers:
  - name: terminal
  - name: text_file
  - name: tensorboard
